# Render Blueprint — service web Vaelan + base Postgres
services:
  - type: web
    name: vaelan
    runtime: python
    plan: starter
    region: frankfurt          # Europe (même région que la base pour la connexion interne)
    autoDeploy: true           # redéploie à chaque push sur la branche suivie
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    # domaines personnalisés (DNS Namecheap : CNAME -> vaelan.onrender.com) ; à déclarer aussi
    # dans le dashboard si le service n'est pas piloté par ce Blueprint
    domains:
      - vaelan.com
      - www.vaelan.com
      - checkin.villa-des-sables-du-lagon.com   # formulaire d'arrivée VDS (CNAME Namecheap -> vaelan.onrender.com)
    envVars:
      - key: PYTHON_VERSION       # figer une version stable (éviter le 3.14 bleeding-edge)
        value: "3.12.8"
      - key: DATABASE_URL
        fromDatabase:
          name: vaelan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Clés API à renseigner dans le dashboard Render (sync: false = secret)
      - key: PENNYLANE_STERNA_TOKEN
        sync: false
      - key: PENNYLANE_KOOKABURA_TOKEN
        sync: false
      # TopOrder — une clé par établissement
      - key: TOPORDER_OCOPAIN_SAINT_LEU_KEY
        sync: false
      - key: TOPORDER_OCOPAIN_LA_POSSESSION_KEY
        sync: false
      - key: TOPORDER_OCOPAIN_SAINTE_MARIE_KEY
        sync: false
      - key: TOPORDER_KOOKABURA_KEY
        sync: false
      # VDS — check-in voyageurs (SCI Les Sables du Lagon)
      - key: LODGIFY_VDS_APIKEY      # alias accepté : LODGIFY_LESSABLESDULAGON_APIKEY
        sync: false
      - key: SMTP_HOST               # Postmark : smtp.postmarkapp.com — envoi des invitations / relances / confirmations
        sync: false
      - key: SMTP_PORT               # 587 (STARTTLS)
        sync: false
      - key: SMTP_USER               # Postmark : Access Key du SMTP Token
        sync: false
      - key: SMTP_PASSWORD           # Postmark : Secret Key du SMTP Token
        sync: false
      - key: SMTP_FROM               # « Villa des Sables du Lagon <adresse@…> »
        sync: false
      - key: PUBLIC_BASE_URL         # racine des liens publics (défaut https://vaelan.com)
        sync: false
      - key: TELEGRAM_BOT_TOKEN      # bot Telegram (@BotFather) — briefs d'équipe, notifications, assistant
        sync: false
      - key: ANTHROPIC_API_KEY       # assistant IA (Claude) dans les groupes Telegram
        sync: false

databases:
  - name: vaelan-db
    plan: basic-256mb
    region: frankfurt          # Europe
