<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
  <title>{% block title %}oWine{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --ow: #8c1a1a; --ow-dark: #4a0d1f; }
    body { background: #f4f1f1; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .wrap { max-width: 620px; margin: 0 auto; padding: 16px 14px 50px; }
    .card { border: 0; border-radius: 12px; box-shadow: 0 4px 18px rgba(74,13,31,.08); }
    h1, h2 { color: var(--ow-dark); }
    .btn-ow { background: var(--ow); color: #fff; border-radius: 10px; font-weight: 600; padding: .65rem 1.2rem; }
    .btn-ow:hover { background: var(--ow-dark); color: #fff; }
    .form-label { font-weight: 600; font-size: .9rem; margin-bottom: .2rem; }
    .form-control, .form-select { border-radius: 10px; padding: .55rem .75rem; }
    .motto { font-family: Georgia, serif; font-style: italic; color: var(--ow); text-align: center; margin-top: 22px; }
    footer { font-size: .75rem; color: #8a8a8a; text-align: center; margin-top: 10px; }
    .hint { font-size: .83rem; color: #666; }
    .lang a { font-size: .85rem; color: var(--ow); }
  </style>
</head>
<body><div class="wrap">
  <div class="d-flex justify-content-between align-items-center mb-2"><a href="https://www.owine.co" target="_blank"><img src="/static/owine_logo.png" alt="oWine" style="height:44px"></a><span class="lang">{% block lang %}{% endblock %}</span></div>
  {% block content %}{% endblock %}
  <div class="motto">« {{ cfg.MOTTO }} »</div>
  <footer>oWine SAS · Parc d'activité, 14 E rue Coubertin, 21000 Dijon · <a href="mailto:{{ cfg.CONTACT_EMAIL }}" style="color:#8a8a8a">{{ cfg.CONTACT_EMAIL }}</a></footer>
</div></body></html>
