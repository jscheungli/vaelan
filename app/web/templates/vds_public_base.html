<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}{{ villa.name }} · {{ T.title }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root { --vds: {{ villa.color }}; --vds-soft: #eef2f6; --vds-accent: #1f8f7a; }
    body { background: #f4f6f8; color: #1d2b3a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 14px 14px 60px; }
    .logo { display:block; margin: 8px auto 4px; max-width: 250px; }
    .card { border: 0; border-radius: 14px; box-shadow: 0 4px 18px rgba(35,65,89,.08); }
    h1, h2, h3 { color: var(--vds); }
    .btn-vds { background: var(--vds); color:#fff; border-radius: 10px; padding: .7rem 1.2rem; font-weight: 600; }
    .btn-vds:hover { background:#1a3247; color:#fff; }
    .btn-outline-vds { border:1.5px solid var(--vds); color: var(--vds); border-radius: 10px; font-weight: 600; }
    .rule { border: 1px solid #dfe5eb; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; background:#fff; }
    .rule.ok { border-color: #bfe3d8; background: #f3fbf8; }
    .rule.ko { border-color: #f1c0c0; background: #fff6f6; }
    .rule .txt { font-size: .97rem; }
    .choice { display:flex; gap:8px; margin-top:10px; }
    .choice label { flex:1; border:1.5px solid #cfd8e0; border-radius:10px; padding:.55rem .6rem; text-align:center; cursor:pointer; font-weight:600; font-size:.92rem; background:#fff; }
    .choice input { display:none; }
    .choice input:checked + label.yes { background: var(--vds-accent); border-color: var(--vds-accent); color:#fff; }
    .choice input:checked + label.no { background:#c0392b; border-color:#c0392b; color:#fff; }
    .confirm { margin-top:10px; padding:8px 10px; border-radius:8px; background:#fff8e6; border:1px solid #f4dfa0; font-size:.88rem; }
    .step { display:none; } .step.active { display:block; }
    .progress { height: 6px; border-radius: 6px; } .progress-bar { background: var(--vds); }
    .steps { display:flex; justify-content:space-between; font-size:.72rem; color:#7b8794; margin-top:4px; text-transform:uppercase; letter-spacing:.03em; }
    .steps span.cur { color: var(--vds); font-weight:700; }
    .form-label { font-weight:600; font-size:.9rem; margin-bottom:.25rem; }
    .form-control, .form-select { border-radius:10px; padding:.6rem .75rem; font-size:1rem; }
    #sigpad { width:100%; height:200px; border:1.5px dashed #9fb0bf; border-radius:12px; background:#fff; touch-action:none; }
    .hint { font-size:.83rem; color:#5f6b76; }
    .lang { font-size:.85rem; }
    .resbar { background:#fff; border:1px solid #dfe5eb; border-radius:12px; padding:10px 12px; margin-top:6px; }
    .resbar .ref { font-size:.9rem; color:#5f6b76; }
    .resbar .ref strong { color: var(--vds); font-size:.95rem; letter-spacing:.02em; }
    .resgrid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
    .resgrid div { background:var(--vds-soft); border-radius:8px; padding:6px 8px; text-align:center; }
    .resgrid span { display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:#7b8794; }
    .resgrid strong { display:block; font-size:.92rem; color:var(--vds); }
    .flags a { display:inline-block; margin-left:6px; opacity:.45; border-radius:3px; line-height:0; }
    .flags a.on { opacity:1; outline:2px solid var(--vds); outline-offset:1px; }
    .flags svg { border-radius:3px; display:block; }
    .chlogo { height:22px; width:auto; max-width:90px; }
    details.more summary { cursor:pointer; color: var(--vds); font-size:.86rem; font-weight:600; list-style:none; }
    details.more summary::-webkit-details-marker { display:none; }
    details.more[open] summary { margin-bottom:2px; }
    footer { font-size:.75rem; color:#8a949e; text-align:center; margin-top:28px; }
  </style>
</head>
<body>
<div class="wrap">
  <a href="{{ villa.site }}" target="_blank"><img class="logo" src="/static/vds/logo.png" alt="{{ villa.name }}"></a>
  {% block content %}{% endblock %}
  <footer>{{ villa.legal }} · {{ villa.rcs }}<br>{{ villa.rgpd_email }} · <span class="text-muted">Vaelan</span></footer>
</div>
{% block scripts %}{% endblock %}
</body>
</html>
